[project]
name = "blindgraspreflex"
version = "0.1.0"
description = "Minimal training code for Blind Grasp Reflex policies."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.14"
dependencies = [
    "imageio[ffmpeg]>=2.37",
    "mjlab==1.5.2",
    "numpy>=1.26",
    "scipy>=1.14",
    "trimesh>=4.8",
    "viser>=1.0",
    # rsl-rl 5.4 still passes Settings(start_method=...), removed in wandb 0.30.
    "wandb==0.28.1",
]

[project.optional-dependencies]
cu128 = ["mjlab[cu128]"]
cpu = ["mjlab[cpu]"]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[project.scripts]
blindgraspreflex = "blindgraspreflex.cli:main"

[project.entry-points."blindgraspreflex.embodiments"]
robotis_5f = "blindgraspreflex.embodiments.robotis_5f:make_embodiment"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blindgraspreflex"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"] # Formatter intentionally leaves long comments and CLI help strings.
